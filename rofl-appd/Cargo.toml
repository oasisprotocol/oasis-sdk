[package]
name = "rofl-appd"
version = "0.0.0"
edition = "2021"

[dependencies]
# Oasis SDK.
cbor = { version = "0.5.1", package = "oasis-cbor" }
oasis-runtime-sdk = { path = "../runtime-sdk" }
oasis-runtime-sdk-evm = { path = "../runtime-sdk/modules/evm" }
rofl-app-core = { path = "../rofl-app-core" }

# Third party.
anyhow = "1.0.86"
axum = "0.8.4"
axum-server = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.12.0", features = ["hex"] }
hex = "0.4"
hyper-util = { version = "0.1.20", features = ["tokio"] }
sp800-185 = "0.2.0"
thiserror = "2.0"
tokio = { version = "1.38", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
] }
tokio-retry = "0.3.2"
zeroize = "1.7"

[dev-dependencies]
rustc-hex = "2.0.1"
serde_json = "1.0"

[features]
default = ["tx"]
# TDX build.
tdx = ["oasis-runtime-sdk/tdx", "rofl-app-core/tdx"]
# Add routes for transaction submission.
tx = []
