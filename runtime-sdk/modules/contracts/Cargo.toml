[package]
name = "oasis-runtime-sdk-contracts"
description = "Smart contracts module for the Oasis Runtime SDK."
version = "0.5.0"
authors = ["Oasis Protocol Foundation <info@oasisprotocol.org>"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
cbor = { version = "0.5.1", package = "oasis-cbor" }
oasis-contract-sdk-crypto = { path = "../../../contract-sdk/crypto" }
oasis-contract-sdk-types = { path = "../../../contract-sdk/types", features = [
    "oasis-runtime-sdk",
] }
oasis-runtime-sdk = { path = "../.." }

# Internal Wasm3 bindings.
wasm3 = { git = "https://github.com/oasisprotocol/wasm3-rs", tag = "v0.3.4" }

# Third party.
anyhow = "1.0"
blake3 = { version = "1.8.7", features = ["traits-preview"] }
lru = "0.18.5"
num-traits = "0.2.14"
once_cell = "1.8.0"
rand = "0.10.3"
snap = "1"
thiserror = "2.0"
walrus = "0.27.2"

[dev-dependencies]
oasis-runtime-sdk = { path = "../..", features = ["test"] }
wat = "1.211"
k256 = "0.14.0"
hex = "0.4.2"
wasmprinter = "0.246.2"
pretty_assertions = "1.3.0"

[features]
debug-utils = []
benchmarks = []  # Enable inline benchmarks for use with `cargo bench`.
